
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Receitas{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    

    <link rel="stylesheet" href="{% static 'frontend/base.css' %}">
    <link rel="stylesheet" href="{% static 'frontend/footer.css' %}">
    <link rel="stylesheet" href="{% static 'frontend/navbar.css' %}">

    <script src="https://unpkg.com/lucide@latest"></script>


    {% block extra_css %}{% endblock %}
</head>
<body>

    <header class="site-header">
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <!-- LOGO -->
            <a class="navbar-brand" href="{% url 'home' %}">
                <span class="brand-icon">
                    <i data-lucide="chef-hat"></i>
                </span>

                <span class="brand-name">
                    A<span>Cozinha</span>
                </span>
            </a>

            <!-- BOTÃO MOBILE -->
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal"
                    aria-expanded="false"
                    aria-label="Abrir menu">

                <i data-lucide="menu"></i>
            </button>

            <!-- MENU -->
            <div class="collapse navbar-collapse" id="menuPrincipal">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'home' %}">
                            <i data-lucide="house"></i>
                            Início
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i data-lucide="book-open"></i>
                            Receitas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i data-lucide="grid-2x2"></i>
                            Categorias
                        </a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>
</header>


    <main>
        {% block content %}{% endblock %}
    </main>

    
<footer class="site-footer">
    <div class="container footer-content">

        <a href="{% url 'home' %}" class="footer-brand">
            A Cozinha
        </a>

        <span class="footer-copy">
            © {% now "Y" %} | Todos os direitos reservados.
        </span>

        <div class="footer-social">
            <a href="#" target="_blank" aria-label="YouTube">
                <i class="bi bi-youtube"></i>
            </a>
            <a href="#" target="_blank" aria-label="Instagram">
                <i class="bi bi-instagram"></i>
            </a>
            <a href="#" target="_blank" aria-label="TikTok">
                <i class="bi bi-tiktok"></i>
            </a>
        </div>

    </div>
</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}
<script>
    lucide.createIcons();
</script>
</body>
</html>
