
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Receitas{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'frontend/base.css' %}">
    <link rel="stylesheet" href="{% static 'frontend/footer.css' %}">


    {% block extra_css %}{% endblock %}
</head>
<body>

    <header class="site-header">
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <!-- MARCA / LOGO -->
            <a class="navbar-brand" href="{% url 'home' %}">

                <span class="brand-logo">
                    <i class="bi bi-egg-fried"></i>
                </span>

                <span class="brand-name">
                    
                </span>

            </a>

            <!-- BOTÃO MOBILE -->
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal"
                    aria-expanded="false"
                    aria-label="Abrir menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- MENU -->
            <div class="collapse navbar-collapse" id="menuPrincipal">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'home' %}">
                            Início
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Receitas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Categorias
                        </a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>
</header>

    <main>
        {% block content %}{% endblock %}
    </main>

    
<footer class="site-footer">
    <div class="container footer-content">

        <a href="{% url 'home' %}" class="footer-brand">
            Cozb
        </a>

        <span class="footer-copy">
            © {% now "Y" %} Receitas. Todos os direitos reservados.
        </span>

        <div class="footer-social">
            <a href="#" target="_blank" aria-label="YouTube">
                <i class="bi bi-youtube"></i>
            </a>
            <a href="#" target="_blank" aria-label="Instagram">
                <i class="bi bi-instagram"></i>
            </a>
            <a href="#" target="_blank" aria-label="TikTok">
                <i class="bi bi-tiktok"></i>
            </a>
        </div>

    </div>
</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
